name: Pulir récords en polígonos (desde la imagen del récord)

on:
  workflow_dispatch:
    inputs:
      minutos:
        description: "Minutos de búsqueda (máx. 330)"
        default: "330"
      semilla_base:
        description: "Semilla base (cámbiala en cada lanzamiento)"
        default: "5000"
      maquinas:
        description: "Número de máquinas (máx. 20)"
        default: "20"

jobs:
  preparar:
    runs-on: ubuntu-latest
    outputs:
      matriz: ${{ steps.m.outputs.matriz }}
    steps:
      - id: m
        env:
          M: ${{ inputs.maquinas }}
        run: echo "matriz=[$(seq -s, 0 $((M - 1)))]" >> "$GITHUB_OUTPUT"

  pulir:
    needs: preparar
    name: máquina ${{ matrix.m }}
    runs-on: ubuntu-latest
    timeout-minutes: 355
    strategy:
      fail-fast: false
      matrix:
        m: ${{ fromJSON(needs.preparar.outputs.matriz) }}
    steps:
      - uses: actions/checkout@v4
      - name: Compilar
        run: cc -O3 -march=native -Wall -o polypack polypack.c -lm
      - name: Pulir
        env:
          MI: ${{ matrix.m }}
          M: ${{ inputs.maquinas }}
          MIN: ${{ inputs.minutos }}
          BASE: ${{ inputs.semilla_base }}
        run: |
          mkdir -p out && cd out
          secs=$((MIN * 60))
          grep -v '^#' ../objetivos_pulir.txt | awk -v m="$MI" -v M="$M" '(NR - 1) % M == m' > mios.txt
          echo "Objetivos de esta máquina:"; cat mios.txt
          i=0
          while read -r K N REC AUTOR; do
            seed=$((BASE + MI * 100 + i))
            # compresión + basin hopping partiendo de la configuración récord digitalizada
            ../polypack $K $N $secs $seed $REC ../initpoly/K${K}_n${N}.txt > K${K}_n${N}.log 2>&1 &
            i=$((i + 1))
          done < mios.txt
          wait
      - name: Resumen y verificación
        if: always()
        run: |
          cd out
          while read -r K N REC AUTOR; do
            f=$(ls best_K${K}_n${N}_seed*.txt 2>/dev/null | head -1)
            if [ -z "$f" ]; then
              echo "K=$K n=$N récord $REC ($AUTOR): sin resultado" >> "$GITHUB_STEP_SUMMARY"
              continue
            fi
            s=$(head -1 "$f" | awk '{printf "%.6f", $2}')
            marca=$(awk -v s="$s" -v r="$REC" 'BEGIN{ if (s < r) print "### ¡MEJORA SEGURA!"; else { d=length(r)-index(r,"."); if (s < r + 10^(-d)) print "(dentro del redondeo: revisar)"; else print "" } }')
            echo "K=$K n=$N récord $REC ($AUTOR): obtuvimos $s $marca" >> "$GITHUB_STEP_SUMMARY"
            if [ -n "$marca" ]; then python3 ../verify_poly.py "$f" "$REC" | tee -a "$GITHUB_STEP_SUMMARY" || true; fi
          done < mios.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pulir-m${{ matrix.m }}
          path: out/
